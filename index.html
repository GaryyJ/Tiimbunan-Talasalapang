<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.85, minimum-scale=0.5, maximum-scale=2.0">
  <title>Dashboard Rekap Ritase Mingguan</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    body { 
      background-color: var(--bg-main); 
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
    }

    /* Container Card Utama */
    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      overflow: hidden;
    }

    /* Header Section di Dalam Card */
    .card-header-custom {
      padding: 20px 24px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
    }

    /* Styling Tabel Modern */
    .table-responsive {
      -webkit-overflow-scrolling: touch;
    }
    
    .table {
      font-size: 0.82rem;
      white-space: nowrap;
      margin-bottom: 0;
    }

    .table th {
      background-color: #1e293b !important; /* Slate Dark Header */
      color: #f8fafc !important;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      padding: 14px 12px;
      border: none;
    }

    .table td {
      padding: 10px 12px;
      border-color: #f1f5f9;
      vertical-align: middle;
    }

    /* === FREEZE / STICKY KHUSUS KOLOM KE-2 (IDENTITAS / UNIT) === */
    .table th:nth-child(2),
    .table td:nth-child(2) {
      position: sticky;
      left: 0;
      background-color: #ffffff;
      z-index: 2;
      box-shadow: 4px 0 8px rgba(0, 0, 0, 0.04);
    }
    
    .table thead th:nth-child(2) {
      background-color: #1e293b !important;
      z-index: 3;
    }
    
    .row-total td:nth-child(2) {
      background-color: #f1f5f9 !important;
    }

    /* Style Badges & Angka */
    .badge-rit { 
      background-color: #eff6ff; 
      color: #2563eb; 
      font-weight: 700; 
      padding: 4px 10px; 
      border-radius: 6px; 
      font-size: 0.8rem;
      border: 1px solid #bfdbfe;
      display: inline-block;
      min-width: 30px;
    }
    
    .row-total { 
      background-color: #f8fafc !important; 
      font-weight: 700;
    }

    .row-total td {
      border-top: 2px solid #cbd5e1 !important;
      border-bottom: 2px solid #cbd5e1 !important;
      color: #0f172a;
    }

    .row-total .badge-rit { 
      background-color: #2563eb; 
      color: white; 
      border: none;
    }

    /* Tampilan Angka 0 Lebih Soft */
    .zero-val {
      color: #cbd5e1;
      font-weight: 400;
    }
    
    .row-spacer { 
      height: 18px; 
      background-color: var(--bg-main); 
    }
    
    .date-sub { 
      font-size: 0.65rem; 
      color: #94a3b8; 
      font-weight: 400; 
      display: block; 
      margin-top: 2px;
    }

    /* Tombol Refresh Modern */
    .btn-refresh {
      background-color: #ffffff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      font-weight: 600;
      padding: 8px 16px;
      transition: all 0.2s ease;
    }
    .btn-refresh:hover {
      background-color: #eff6ff;
      color: #1d4ed8;
      border-color: #93c5fd;
    }
  </style>
</head>
<body class="py-3 py-md-4">

  <div class="container-fluid container-xl">

    <!-- Status Loading -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted small fw-medium">Memuat data rekap mingguan...</p>
    </div>

    <!-- Container Utama Dashboard -->
    <div id="content" class="d-none">
      <div class="main-card">
        
        <!-- Header Judul & Tombol Refresh -->
        <div class="card-header-custom d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h4 class="fw-bold mb-0 text-dark d-flex align-items-center gap-2">
              <i class="fa-solid fa-truck-fast text-primary"></i>
              <span>Dashboard Rekap Proyek</span>
            </h4>
            <p class="text-muted small mb-0 mt-1">Data Rekap Ritase Mingguan (Mobil Milik & Mobil Sewa)</p>
          </div>
          <button onclick="loadAllData()" class="btn btn-refresh btn-sm d-flex align-items-center gap-2">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Refresh Data</span>
          </button>
        </div>

        <!-- Tabel Data -->
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead id="headMingguan"></thead>
            <tbody id="bodyMingguan"></tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <script>
    // 🔗 URL Google Apps Script Anda
    const API_URL = "https://script.google.com/macros/s/AKfycbyn_wZxGMneEPXqgWlK9kkhMDNVOZe3m6JfkgGSlJ7XF7hZvFs8UVjuLQ6rWDcNkPo/exec";

    async function loadAllData() {
      document.getElementById('loading').classList.remove('d-none');
      document.getElementById('content').classList.add('d-none');

      try {
        const response = await fetch(API_URL);
        const result = await response.json();

        if (result.status === "success" || result.data) {
          let mingguanData = result.data || result;
          renderMingguan(mingguanData);

          document.getElementById('loading').classList.add('d-none');
          document.getElementById('content').classList.remove('d-none');
        } else {
          alert("Gagal mengambil data dari Google Sheets!");
        }
      } catch (error) {
        console.error("Fetch error:", error);
        alert("Terjadi kesalahan koneksi! Periksa URL API Apps Script Anda.");
      }
    }

    function renderMingguan(data) {
      const thead = document.getElementById('headMingguan');
      const tbody = document.getElementById('bodyMingguan');
      
      if (!data || !Array.isArray(data) || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="text-center text-muted py-4">Data Ritase tidak ditemukan</td></tr>`;
        return;
      }

      // Build Header
      let headRow = "<tr>";
      if (data[0]) {
        data[0].forEach((col, idx) => {
          if (idx < 11) {
            if (idx === 0 || idx === 1) headRow += `<th class="text-start">${col}</th>`;
            else headRow += `<th class="text-center">${col}${data[1] && data[1][idx] ? `<span class="date-sub">${data[1][idx]}</span>` : ''}</th>`;
          }
        });
      }
      headRow += "</tr>";
      thead.innerHTML = headRow;

      // Build Body
      tbody.innerHTML = "";
      for (let i = 2; i < data.length; i++) {
        let row = data[i];
        if (!row || row.every(c => c === "" || c === null)) continue;

        let label = String(row[0] || "").toLowerCase();
        let isTotal = label.includes("total");
        let tr = `<tr class="${isTotal ? 'row-total' : ''}">`;

        row.forEach((cell, idx) => {
          if (idx < 11) {
            if (idx === 0) tr += `<td class="fw-semibold text-secondary">${cell}</td>`;
            else if (idx === 1) tr += `<td class="fw-bold text-primary">${cell}</td>`;
            else {
              let num = parseFloat(cell);
              if (num > 0) {
                tr += `<td class="text-center"><span class="badge-rit">${cell}</span></td>`;
              } else {
                tr += `<td class="text-center zero-val">${cell || '0'}</td>`;
              }
            }
          }
        });
        tr += "</tr>";
        tbody.innerHTML += tr;

        if (label.includes("total mobil milik")) {
          tbody.innerHTML += `<tr class="row-spacer"><td colspan="11"></td></tr>`;
        }
      }
    }

    // Load data otomatis saat dibuka
    loadAllData();
  </script>
</body>
</html>
