<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Dashboard Rekap Proyek</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: #f8fafc;
      --card-bg: #ffffff;
      
      /* Warna Kuning Ramah di Mata (Soft Amber) */
      --header-bg: #fef3c7; 
      --header-text: #78350f;
      --header-border: #fde68a;
      --sub-date-color: #92400e;   
      
      /* Sel Data Netral & Ramah Dibaca */
      --table-cell-bg: #ffffff;
      --table-cell-text: #1e293b;
      --border-color: #e2e8f0;
      
      /* Accent Badges */
      --badge-bg: #2563eb;
      --badge-text: #ffffff;
      
      --badge-total-bg: #f59e0b;
      --badge-total-text: #ffffff;

      /* Baris Total Sub */
      --total-sub-bg: #f8fafc;     
      --total-sub-text: #0f172a;
    }

    * {
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    body { 
      background: var(--bg-gradient); 
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--table-cell-text);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    .main-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .card-header-custom {
      padding: 12px 18px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
    }

    .nav-tabs-custom {
      border-bottom: 2px solid var(--header-border);
      background: #f8fafc;
      padding: 6px 8px 0 8px;
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      white-space: nowrap;
    }

    .nav-tabs-custom::-webkit-scrollbar { display: none; }

    .nav-tabs-custom .nav-link {
      color: #64748b;
      font-weight: 700;
      font-size: 0.75rem;
      border: none;
      padding: 8px 16px;
      border-radius: 6px 6px 0 0;
      transition: all 0.2s ease;
    }

    .nav-tabs-custom .nav-link.active {
      color: var(--header-text);
      background: var(--header-bg);
    }

    .table-responsive {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    /* DESAIN TABEL CLEAN & SOFT */
    .table-main {
      font-size: 0.72rem;
      white-space: nowrap;
      margin-bottom: 0;
      width: 100%;
      border-collapse: collapse;
    }

    .table-main th {
      background: var(--header-bg) !important;
      color: var(--header-text) !important;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.65rem;
      letter-spacing: 0.3px;
      padding: 8px 6px;
      border: 1px solid var(--header-border);
      text-align: center;
      line-height: 1.2;
    }

    .date-sub {
      display: block;
      color: var(--sub-date-color) !important;
      font-size: 0.60rem;
      font-weight: 600;
      margin-top: 1px;
    }

    .table-main td {
      padding: 6px 8px;
      background-color: var(--table-cell-bg);
      color: var(--table-cell-text);
      vertical-align: middle;
      line-height: 1.2;
      border: 1px solid var(--border-color);
    }

    /* Baris Total Sub */
    .row-total td { 
      background-color: var(--total-sub-bg) !important; 
      color: var(--total-sub-text) !important;
      font-weight: 800;
      border-top: 2px solid #cbd5e1;
    }

    /* BADGES RITASE */
    .badge-rit { 
      background-color: var(--badge-bg); 
      color: var(--badge-text); 
      font-weight: 800; 
      border-radius: 4px; 
      font-size: 0.70rem;
      padding: 2px 8px;
      display: inline-block;
      min-width: 26px;
      text-align: center;
    }

    .badge-rit-total {
      background: var(--badge-total-bg);
      color: var(--badge-total-text);
      font-weight: 800;
      border-radius: 4px;
      font-size: 0.70rem;
      padding: 2px 8px;
      display: inline-block;
      min-width: 26px;
      text-align: center;
    }

    .zero-val {
      color: #cbd5e1;
      font-weight: 400;
    }

    .table-wrapper {
      margin-bottom: 1.2rem;
    }

    .table-category-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* SUMMARY TABLE */
    .summary-card-v1 {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 1.2rem;
    }
    
    .table-v1 {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .table-v1 .title-bg {
      background: var(--header-bg);
      color: var(--header-text);
      font-weight: 800;
      font-size: 0.75rem;
      padding: 8px;
      text-align: center;
      border: 1px solid var(--header-border);
    }

    .table-v1 th {
      background-color: #fef9c3;
      color: #713f12;
      font-weight: 800;
      font-size: 0.65rem;
      padding: 6px 4px;
      text-align: center;
      border: 1px solid #fde047;
    }

    .table-v1 td {
      padding: 6px 8px;
      background: #ffffff;
      color: #1e293b;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .table-v1 .col-label {
      font-weight: 700;
      color: #0f172a;
      background-color: #f8fafc;
      text-align: left;
    }

    .table-v1 .row-grand-total td {
      background-color: #f8fafc;
      font-weight: 800;
      color: #0f172a;
      border-top: 2px solid #cbd5e1;
    }

    .btn-refresh {
      background-color: var(--header-bg);
      color: var(--header-text);
      border: 1px solid var(--header-border);
      border-radius: 6px;
      font-weight: 700;
      padding: 6px 12px;
      font-size: 0.72rem;
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      background-color: #fde68a;
    }
  </style>
</head>
<body class="py-3">

  <div class="container-fluid container-xl">

    <!-- Loading Screen -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-amber spinner-border-sm" style="color: #f59e0b;" role="status"></div>
      <p class="mt-2 text-dark fw-bold" style="font-size: 0.75rem;">Memuat Data Dashboard...</p>
    </div>

    <!-- Main Content Card -->
    <div id="content" class="d-none">
      <div class="main-card">
        
        <!-- Dashboard Header -->
        <div class="card-header-custom d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h4 class="fw-bold mb-0 text-dark d-flex align-items-center gap-2" style="font-size: 1.1rem;">
              <i class="fa-solid fa-chart-pie" style="color: #2563eb;"></i>
              <span>Dashboard Rekap Proyek</span>
            </h4>
            <p class="text-muted mb-0" style="font-size: 0.68rem;">Sistem Integrasi Operational Tambang</p>
          </div>
          <button onclick="loadAllData()" class="btn btn-refresh d-flex align-items-center gap-1">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Refresh</span>
          </button>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-tabs nav-tabs-custom" id="projectTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="rekap-tab" data-bs-toggle="tab" data-bs-target="#rekap-pane" type="button" role="tab">
              <i class="fa-solid fa-layer-group me-1"></i>Rekap Mingguan
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="solar-tab" data-bs-toggle="tab" data-bs-target="#solar-pane" type="button" role="tab">
              <i class="fa-solid fa-gas-pump me-1"></i>Solar Hexa
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tambang-tab" data-bs-toggle="tab" data-bs-target="#tambang-pane" type="button" role="tab">
              <i class="fa-solid fa-file-invoice-dollar me-1"></i>Penagihan Tambang
            </button>
          </li>
        </ul>

        <!-- Tab Contents -->
        <div class="tab-content" id="projectTabsContent">
          
          <!-- TAB 1: REKAP MINGGUAN -->
          <div class="tab-pane fade show active p-3" id="rekap-pane" role="tabpanel">
            <!-- Content render via JavaScript -->
          </div>

          <!-- TAB 2: SOLAR HEXA -->
          <div class="tab-pane fade p-3" id="solar-pane" role="tabpanel">
            <div class="table-responsive">
              <table class="table table-main align-middle mb-0">
                <thead>
                  <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Waktu</th>
                    <th>Unit Hexa</th>
                    <th>Jumlah (L)</th>
                    <th>Harga/L (Rp)</th>
                    <th>Total Biaya (Rp)</th>
                    <th>Keterangan / Suplier</th>
                  </tr>
                </thead>
                <tbody id="bodySolar"></tbody>
              </table>
            </div>
          </div>

          <!-- TAB 3: PENAGIHAN TAMBANG -->
          <div class="tab-pane fade p-3" id="tambang-pane" role="tabpanel">
            <div class="table-responsive">
              <table class="table table-main align-middle mb-0">
                <thead>
                  <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Total Ritase</th>
                    <th>Harga Keamanan (Rp)</th>
                    <th>Harga Tanah (Rp)</th>
                    <th>Total Tagihan (Rp)</th>
                    <th>Keterangan</th>
                  </tr>
                </thead>
                <tbody id="bodyTambang"></tbody>
              </table>
            </div>
          </div>

        </div>

      </div>
    </div>

  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby08PgGmtdpFBIT6gz7JogzZEnkWhu2SMwg6vJdJ8--GSFjGNoNx0RJgc0r4Y7Xmuuj/exec";

    async function loadAllData() {
      document.getElementById('loading').classList.remove('d-none');
      document.getElementById('content').classList.add('d-none');

      try {
        const response = await fetch(API_URL);
        const result = await response.json();

        if (result.status === "success" || result.data || result) {
          let rawData = result.data || result;

          renderMingguan(rawData.rekap || rawData);
          renderSolar(rawData.solar || []);
          renderTambang(rawData.tambang || []);

          document.getElementById('loading').classList.add('d-none');
          document.getElementById('content').classList.remove('d-none');
        } else {
          alert("Gagal mengambil data dari Google Sheets!");
        }
      } catch (error) {
        console.error("Fetch error:", error);
        alert("Terjadi kesalahan koneksi!");
      }
    }

    function renderMingguan(data) {
      const containerTab = document.getElementById('rekap-pane');
      
      if (!data || !Array.isArray(data) || data.length === 0) {
        containerTab.innerHTML = `<div class="text-center text-muted py-3">Data Rekap tidak ditemukan</div>`;
        return;
      }

      let rincianData = [];
      let ringkasanData = [];
      let isSummarySection = false;

      for (let idx = 0; idx < data.length; idx++) {
        let cell0 = String(data[idx][0] || "").trim().toUpperCase();
        let cell1 = String(data[idx][1] || "").trim().toUpperCase();
        let cell2 = String(data[idx][2] || "").trim().toUpperCase();

        if (cell0.includes("REKAPAN HARIAN") || cell1.includes("REKAPAN HARIAN") || cell2.includes("REKAPAN HARIAN") || isSummarySection) {
          isSummarySection = true;
          ringkasanData.push(data[idx]);
        } else {
          rincianData.push(data[idx]);
        }
      }

      const maxCols = Math.max(...rincianData.map(row => row ? row.length : 0));
      let headHtml = "<tr>";
      if (rincianData[0]) {
        for (let idx = 0; idx < maxCols; idx++) {
          let col = rincianData[0][idx] !== undefined ? rincianData[0][idx] : "";
          let subDate = (rincianData[1] && rincianData[1][idx]) ? `<span class="date-sub">${rincianData[1][idx]}</span>` : '';
          headHtml += `<th class="${idx <= 2 ? 'text-start ps-3' : 'text-center'}">${col}${subDate}</th>`;
        }
      }
      headHtml += "</tr>";

      let rowsMobilYZ = [];
      let rowsMobilSewa = [];

      for (let i = 2; i < rincianData.length; i++) {
        let row = rincianData[i];
        if (!row || row.every(c => c === "" || c === null)) continue;

        let jenisArmada = String(row[0] || "").toLowerCase();

        if (jenisArmada.includes("sewa")) {
          if (row[0]) row[0] = "Mobil Sewa";
          rowsMobilSewa.push(row);
        } else {
          rowsMobilYZ.push(row);
        }
      }

      function generateTableHTML(rowArray, title, iconClass) {
        let bodyRows = "";
        for (let row of rowArray) {
          let label = String(row[0] || "").toLowerCase();
          let isTotal = label.includes("total");
          let tr = `<tr class="${isTotal ? 'row-total' : ''}">`;

          for (let idx = 0; idx < maxCols; idx++) {
            let cell = row[idx] !== undefined ? row[idx] : "";
            let isLastColumn = (idx === maxCols - 1); 

            if (idx === 0) tr += `<td class="text-start ps-3 fw-semibold">${cell}</td>`;
            else if (idx === 1) tr += `<td class="text-start font-monospace">${cell}</td>`;
            else if (idx === 2) tr += `<td class="text-start">${cell}</td>`;
            else {
              let num = parseFloat(String(cell).replace(/[^0-9.-]+/g, ""));
              if (!isNaN(num) && num > 0) {
                if (isTotal || isLastColumn) {
                  tr += `<td class="text-center"><span class="badge-rit-total">${cell}</span></td>`;
                } else {
                  tr += `<td class="text-center"><span class="badge-rit">${cell}</span></td>`;
                }
              } else {
                tr += `<td class="text-center zero-val">${cell || '0'}</td>`;
              }
            }
          }
          tr += "</tr>";
          bodyRows += tr;
        }

        return `
          <div class="table-wrapper">
            <div class="table-category-title">
              <i class="${iconClass}" style="color: #2563eb;"></i>
              <span>${title}</span>
            </div>
            <div class="table-responsive">
              <table class="table table-main align-middle mb-0">
                <thead>${headHtml}</thead>
                <tbody>${bodyRows}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      let mainContentHtml = "";
      
      if (rowsMobilYZ.length > 0) {
        mainContentHtml += generateTableHTML(rowsMobilYZ, "Rincian Ritase - Mobil YZ", "fa-solid fa-truck-front");
      }
      
      if (rowsMobilSewa.length > 0) {
        mainContentHtml += generateTableHTML(rowsMobilSewa, "Rincian Ritase - Mobil Sewa", "fa-solid fa-truck-ramp-box");
      }

      mainContentHtml += `<div id="containerRingkasan" class="summary-card-v1 d-none"></div>`;
      containerTab.innerHTML = mainContentHtml;

      renderTabelRekapanHarian(ringkasanData);
    }

    function renderTabelRekapanHarian(ringkasanData) {
      const container = document.getElementById('containerRingkasan');

      if (!ringkasanData || ringkasanData.length === 0) {
        container.classList.add('d-none');
        return;
      }

      container.classList.remove('d-none');

      let headHariRow = ringkasanData.find(r => r.some(c => String(c).toLowerCase().includes("ming") || String(c).toLowerCase().includes("sen"))) || [];
      let headTglRow = ringkasanData.find(r => r.some(c => String(c).includes("/") || String(c).includes("-"))) || [];

      let hariList = ["Ming", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"];
      let tglList = ["26/07/2026", "27/07/2026", "28/07/2026", "29/07/2026", "30/07/2026", "31/07/2026", "01/08/2026"];

      if (headHariRow.length > 0) {
        let extractedHari = headHariRow.filter(c => c !== "" && !String(c).toLowerCase().includes("jenis"));
        if (extractedHari.length >= 7) hariList = extractedHari.slice(0, 7);
      }
      if (headTglRow.length > 0) {
        let extractedTgl = headTglRow.filter(c => String(c).includes("/") || String(c).includes("-"));
        if (extractedTgl.length >= 7) tglList = extractedTgl.slice(0, 7);
      }

      let rowYZ = ringkasanData.find(r => r.some(c => String(c).toLowerCase().includes("total mobil yz")));
      let rowSewa = ringkasanData.find(r => r.some(c => String(c).toLowerCase().includes("total mobil sewa")));
      let rowTotal = ringkasanData.find(r => r.some(c => String(c).trim().toLowerCase() === "total"));

      const extractValues = (rowArr) => {
        if (!rowArr) return Array(8).fill(0);
        let vals = rowArr.filter(c => c !== "" && c !== null && !String(c).toLowerCase().includes("total") && !String(c).toLowerCase().includes("mobil"));
        while(vals.length < 8) vals.push(0);
        return vals.slice(0, 8);
      };

      let valYZ = extractValues(rowYZ);
      let valSewa = extractValues(rowSewa);
      let valTotal = extractValues(rowTotal);

      let html = `
        <div class="table-responsive">
          <table class="table-v1">
            <thead>
              <tr>
                <th colspan="9" class="title-bg">
                  <i class="fa-solid fa-calculator me-1"></i>REKAPAN HARIAN MOBIL YZ & SEWA
                </th>
              </tr>
              <tr>
                <th rowspan="2" style="vertical-align: middle;" class="text-start ps-3">Jenis / Armada</th>
                ${hariList.map(h => `<th>${h}</th>`).join('')}
                <th rowspan="2" style="vertical-align: middle;">Total Rit</th>
              </tr>
              <tr>
                ${tglList.map(t => `<th style="font-weight: 600; color: #854d0e;">${t}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
      `;

      html += `<tr><td class="col-label ps-3">Total Mobil YZ</td>`;
      valYZ.forEach((v, idx) => {
        let isTotalCol = idx === 7;
        let num = parseFloat(v) || 0;
        if (isTotalCol) {
          html += `<td class="text-center"><span class="badge-rit-total">${v}</span></td>`;
        } else {
          html += `<td class="text-center ${num === 0 ? 'zero-val' : 'fw-bold'}">${v}</td>`;
        }
      });
      html += `</tr>`;

      html += `<tr><td class="col-label ps-3">Total Mobil Sewa</td>`;
      valSewa.forEach((v, idx) => {
        let isTotalCol = idx === 7;
        let num = parseFloat(v) || 0;
        if (isTotalCol) {
          html += `<td class="text-center"><span class="badge-rit-total">${v}</span></td>`;
        } else {
          html += `<td class="text-center ${num === 0 ? 'zero-val' : 'fw-bold'}">${v}</td>`;
        }
      });
      html += `</tr>`;

      html += `<tr class="row-grand-total"><td class="col-label ps-3 fw-bold">GRAND TOTAL RITASE</td>`;
      valTotal.forEach((v, idx) => {
        let isTotalCol = idx === 7;
        let num = parseFloat(v) || 0;
        if (isTotalCol) {
          html += `<td class="text-center"><span class="badge-rit-total">${v}</span></td>`;
        } else {
          html += `<td class="text-center fw-bold ${num === 0 ? 'zero-val' : ''}">${v}</td>`;
        }
      });
      html += `</tr>`;

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    function renderSolar(data) {
      const tbody = document.getElementById('bodySolar');
      tbody.innerHTML = "";
      if (!data || data.length <= 1) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-2">Belum ada transaksi Solar Hexa</td></tr>`;
        return;
      }
      for (let i = 1; i < data.length; i++) {
        let r = data[i];
        if (!r || r.length === 0 || r.every(c => c === "")) continue;
        tbody.innerHTML += `
          <tr>
            <td class="text-center">${r[0] || ''}</td>
            <td class="text-center">${r[1] || ''}</td>
            <td class="text-center">${r[2] || ''}</td>
            <td class="text-start">${r[3] || ''}</td>
            <td class="text-center fw-bold">${r[4] || '0'}</td>
            <td class="text-end">${r[5] || 'Rp0'}</td>
            <td class="text-end fw-bold">${r[6] || 'Rp0'}</td>
            <td class="text-start">${r[7] || ''}</td>
          </tr>
        `;
      }
    }

    function renderTambang(data) {
      const tbody = document.getElementById('bodyTambang');
      tbody.innerHTML = "";
      if (!data || data.length <= 1) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-2">Belum ada data Penagihan Tambang</td></tr>`;
        return;
      }
      for (let i = 1; i < data.length; i++) {
        let r = data[i];
        if (!r || r.length === 0 || r.every(c => c === "")) continue;
        tbody.innerHTML += `
          <tr>
            <td class="text-center">${r[0] || ''}</td>
            <td class="text-center">${r[1] || ''}</td>
            <td class="text-center fw-bold"><span class="badge-rit">${r[2] || '0'} Rit</span></td>
            <td class="text-end">${r[3] || 'Rp0'}</td>
            <td class="text-end">${r[4] || 'Rp0'}</td>
            <td class="text-end fw-bold">${r[5] || 'Rp0'}</td>
            <td class="text-start">${r[6] || ''}</td>
          </tr>
        `;
      }
    }

    loadAllData();
  </script>
</body>
</html>
